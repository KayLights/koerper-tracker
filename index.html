<title>Körper-Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#211622;
    --card:#2B1D2E;
    --wine:#97314B;
    --sage:#7C9885;
    --gold:#C9A15D;
    --cream:#F1E7DD;
    --wine-tint:rgba(151,49,75,0.24);
    --wine-tint-strong:rgba(151,49,75,0.42);
    --border:rgba(241,231,221,0.14);
    --border-soft:rgba(241,231,221,0.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    overscroll-behavior-y:contain;
  }
  h1,h2,h3,.font-display{
    font-family:'Fraunces',Georgia,serif;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  header.topbar{
    padding:20px 16px 8px;
  }
  header.topbar h1{
    font-size:1.4rem;
    font-weight:600;
    margin:0;
    color:var(--cream);
    letter-spacing:0.01em;
  }
  header.topbar .subtitle{
    font-size:0.82rem;
    color:rgba(241,231,221,0.55);
    margin-top:2px;
  }
  main{
    flex:1;
    padding:8px 16px 24px;
  }

  /* Date nav */
  .date-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin:12px 0 14px;
  }
  .date-nav button{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--cream);
    width:44px;
    height:44px;
    border-radius:14px;
    font-size:1.2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .date-nav button:active{background:var(--wine-tint);}
  .date-nav button:disabled{opacity:0.3;}
  .date-nav .date-label{
    flex:1;
    text-align:center;
    font-family:'Fraunces',serif;
    font-size:1.05rem;
    font-weight:600;
    line-height:1.25;
  }
  .date-nav .date-label .rel{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:0.72rem;
    font-weight:500;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:2px;
  }

  /* Quick select strip */
  .quick-select{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 14px;
    scrollbar-width:none;
  }
  .quick-select::-webkit-scrollbar{display:none;}
  .qs-day{
    flex-shrink:0;
    width:52px;
    height:64px;
    border-radius:14px;
    background:var(--card);
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    color:var(--cream);
  }
  .qs-day .wd{font-size:0.68rem;opacity:0.6;text-transform:uppercase;letter-spacing:0.03em;}
  .qs-day .dn{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;}
  .qs-day .dot{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:1px;}
  .qs-day.period{background:var(--wine-tint-strong);border-color:var(--wine);}
  .qs-day.period .dot{background:var(--wine);}
  .qs-day.selected{border-color:var(--gold);background:rgba(201,161,93,0.18);}
  .qs-day.selected .dn{color:var(--gold);}
  .qs-day.today .wd{color:var(--gold);}

  /* Category cards */
  .cat-card{
    background:var(--card);
    border-radius:18px;
    padding:16px 14px;
    margin-bottom:12px;
    border:1px solid var(--border-soft);
  }
  .cat-card h3{
    margin:0 0 10px;
    font-size:0.98rem;
    font-weight:600;
    color:var(--cream);
  }
  .opt-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .opt-btn{
    border:1px solid var(--border);
    background:rgba(241,231,221,0.05);
    color:var(--cream);
    padding:11px 14px;
    border-radius:12px;
    font-size:0.88rem;
    font-family:'Inter',sans-serif;
    font-weight:500;
    min-height:44px;
    line-height:1.2;
    flex:1 1 auto;
    text-align:center;
  }
  .opt-btn:active{transform:scale(0.97);}
  .opt-btn.selected{
    background:var(--gold);
    border-color:var(--gold);
    color:#211622;
    font-weight:700;
  }

  /* Tabs */
  nav.tabbar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    background:rgba(33,22,34,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border-soft);
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  nav.tabbar .inner{
    max-width:560px;
    width:100%;
    display:flex;
  }
  .tab-btn{
    flex:1;
    background:none;
    border:none;
    color:rgba(241,231,221,0.5);
    padding:12px 4px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-family:'Inter',sans-serif;
    font-size:0.72rem;
    font-weight:600;
  }
  .tab-btn .ic{font-size:1.25rem;line-height:1;}
  .tab-btn.active{color:var(--gold);}

  /* Verlauf */
  .day-entry{
    background:var(--card);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    border-left:4px solid var(--border);
  }
  .day-entry.period{
    border-left:4px solid var(--wine);
    background:var(--wine-tint);
  }
  .day-entry .de-date{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1rem;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .day-entry .de-date .badge{
    font-size:0.62rem;
    background:var(--wine);
    color:var(--cream);
    padding:2px 7px;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }
  .de-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .de-tag{
    font-size:0.76rem;
    background:rgba(241,231,221,0.07);
    border:1px solid var(--border-soft);
    padding:4px 9px;
    border-radius:9px;
    color:rgba(241,231,221,0.85);
  }
  .de-tag b{color:var(--cream);font-weight:600;}
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:rgba(241,231,221,0.5);
    font-size:0.9rem;
    line-height:1.5;
  }

  /* Backup */
  .backup-card{
    background:var(--card);
    border-radius:18px;
    padding:16px 16px 14px;
    margin-bottom:16px;
    border:1px solid var(--border-soft);
  }
  .backup-card h3{
    margin:0 0 4px;
    font-size:0.98rem;
    font-weight:600;
    color:var(--cream);
  }
  .backup-card .backup-hint{
    font-size:0.78rem;
    color:rgba(241,231,221,0.55);
    line-height:1.45;
    margin-bottom:12px;
  }
  .backup-actions{
    display:flex;
    gap:10px;
  }
  .backup-btn{
    flex:1;
    border:1px solid var(--border);
    background:rgba(241,231,221,0.05);
    color:var(--cream);
    padding:12px 10px;
    border-radius:12px;
    font-size:0.86rem;
    font-family:'Inter',sans-serif;
    font-weight:600;
    min-height:44px;
  }
  .backup-btn:active{transform:scale(0.97);}
  .backup-btn.primary{
    background:var(--sage);
    border-color:var(--sage);
    color:#211622;
  }
  .backup-status{
    margin-top:10px;
    font-size:0.78rem;
    color:var(--gold);
    line-height:1.4;
  }

  /* Einblicke */
  .section-title{
    font-size:1.02rem;
    font-weight:600;
    margin:6px 0 12px;
    color:var(--cream);
  }
  .ring-wrap{
    background:var(--card);
    border-radius:18px;
    padding:18px 12px 14px;
    margin-bottom:20px;
    border:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .ring-legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:12px;
    font-size:0.76rem;
    color:rgba(241,231,221,0.75);
  }
  .ring-legend .li{display:flex;align-items:center;gap:6px;}
  .ring-legend .sw{width:10px;height:10px;border-radius:3px;}
  .insight-card{
    background:var(--card);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    border-left:4px solid var(--gold);
    font-size:0.9rem;
    line-height:1.5;
  }
  .insight-card b{color:var(--gold);}
  .insight-note{
    text-align:center;
    padding:30px 18px;
    color:rgba(241,231,221,0.55);
    font-size:0.88rem;
    line-height:1.55;
    background:var(--card);
    border-radius:16px;
    border:1px solid var(--border-soft);
  }
  .insight-note .progress{
    margin-top:10px;
    font-size:0.8rem;
    color:var(--sage);
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "daily-logs";

  var CATEGORIES = [
    { id:"periode", label:"Periode / Ausfluss", options:[
        {v:"blut", l:"Blut"},
        {v:"nichts", l:"nichts"},
        {v:"durchsichtig-duenn", l:"durchsichtig dünn"},
        {v:"durchsichtig-dick", l:"durchsichtig dick"},
        {v:"weiss-duenn", l:"weiß dünn"},
        {v:"weiss-dick", l:"weiß dick"},
        {v:"braun", l:"braun"}
    ]},
    { id:"koerpergefuehl", label:"Körpergefühl", options:[
        {v:"neutral", l:"Neutral"},
        {v:"lust", l:"Lust"},
        {v:"negativ", l:"Negativ"}
    ]},
    { id:"empfindlichkeit", label:"Empfindlichkeit", options:[
        {v:"stark", l:"stark"},
        {v:"leicht", l:"leicht"},
        {v:"neutral", l:"neutral"},
        {v:"negativ", l:"negativ"}
    ]},
    { id:"hautTendenz", label:"Haut – Tendenz", options:[
        {v:"schlimmer", l:"wird schlimmer"},
        {v:"besser", l:"wird besser"},
        {v:"stabil", l:"stabil"}
    ]},
    { id:"hautUnreinheiten", label:"Haut – Unreinheiten", options:[
        {v:"starke", l:"starke"},
        {v:"leichte", l:"leichte"},
        {v:"kaum", l:"kaum"}
    ]},
    { id:"energie", label:"Energielevel", options:[
        {v:"energiegeladen", l:"energiegeladen"},
        {v:"normal", l:"normal"},
        {v:"erschoepft", l:"erschöpft / lustlos"}
    ]},
    { id:"verdauung", label:"Verdauung / Bauch", options:[
        {v:"normal", l:"normal"},
        {v:"blaehungen", l:"Blähungen"},
        {v:"durchfall", l:"Durchfall"},
        {v:"verstopfung", l:"Verstopfung"}
    ]}
  ];

  var CAT_BY_ID = {};
  CATEGORIES.forEach(function(c){ CAT_BY_ID[c.id] = c; });

  // ---------- date helpers (local time, no UTC shift) ----------
  function fmtDate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + day;
  }
  function parseDate(s){
    var parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function addDays(d, n){
    var nd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    nd.setDate(nd.getDate()+n);
    return nd;
  }
  function todayDate(){
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function sameDay(a,b){ return fmtDate(a)===fmtDate(b); }
  function isPeriodLog(log){ return !!log && log.periode === "blut"; }

  // ---------- storage ----------
  function loadLogs(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      console.error("Konnte Logs nicht laden:", e);
      return {};
    }
  }
  function saveLogs(logs){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }catch(e){
      console.error("Konnte Logs nicht speichern:", e);
    }
  }

  // ---------- state ----------
  var state = {
    tab: "heute",
    currentDate: todayDate(),
    logs: loadLogs()
  };

  function setValue(dateStr, catId, value){
    var day = state.logs[dateStr] ? Object.assign({}, state.logs[dateStr]) : {};
    if(day[catId] === value){
      delete day[catId];
    } else {
      day[catId] = value;
    }
    var hasAny = Object.keys(day).some(function(k){ return day[k]; });
    if(hasAny){
      state.logs[dateStr] = day;
    } else {
      delete state.logs[dateStr];
    }
    saveLogs(state.logs);
    render();
  }

  // ---------- rendering ----------
  var app = document.getElementById("app");

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if(attrs){
      Object.keys(attrs).forEach(function(k){
        if(k === "class") e.className = attrs[k];
        else if(k === "html") e.innerHTML = attrs[k];
        else if(k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
        else if(k === "disabled") e.disabled = !!attrs[k];
        else if(attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
      });
    }
    (children||[]).forEach(function(c){
      if(c === null || c === undefined) return;
      if(typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  function render(){
    app.innerHTML = "";
    app.appendChild(buildHeader());

    var main = el("main", {});
    if(state.tab === "heute") main.appendChild(buildHeute());
    else if(state.tab === "verlauf") main.appendChild(buildVerlauf());
    else main.appendChild(buildEinblicke());
    app.appendChild(main);

    app.appendChild(buildTabbar());
  }

  function buildHeader(){
    var titles = { heute:"Heute", verlauf:"Verlauf", einblicke:"Einblicke" };
    var subs = {
      heute:"Wie fühlst du dich heute?",
      verlauf:"Alle erfassten Tage",
      einblicke:"Muster & Zyklus-Überblick"
    };
    return el("header",{class:"topbar"},[
      el("h1",{},[titles[state.tab]]),
      el("div",{class:"subtitle"},[subs[state.tab]])
    ]);
  }

  function buildTabbar(){
    var tabs = [
      {id:"heute", label:"Heute", icon:"◐"},
      {id:"verlauf", label:"Verlauf", icon:"☰"},
      {id:"einblicke", label:"Einblicke", icon:"◎"}
    ];
    var inner = el("div",{class:"inner"});
    tabs.forEach(function(t){
      var btn = el("button",{
        class:"tab-btn" + (state.tab===t.id ? " active":""),
        onclick:function(){ state.tab = t.id; render(); }
      },[
        el("span",{class:"ic"},[t.icon]),
        el("span",{},[t.label])
      ]);
      inner.appendChild(btn);
    });
    return el("nav",{class:"tabbar"},[inner]);
  }

  // ----- Heute -----
  function buildHeute(){
    var wrap = el("div",{});
    var d = state.currentDate;
    var isToday = sameDay(d, todayDate());
    var dateStr = fmtDate(d);

    var label = d.toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
    var rel = isToday ? "Heute" : (sameDay(d, addDays(todayDate(),-1)) ? "Gestern" : (sameDay(d, addDays(todayDate(),1)) ? "Morgen" : ""));

    var nav = el("div",{class:"date-nav"},[
      el("button",{onclick:function(){ state.currentDate = addDays(state.currentDate,-1); render(); }},["‹"]),
      el("div",{class:"date-label"},[
        label,
        rel ? el("span",{class:"rel"},[rel]) : null
      ]),
      el("button",{
        disabled: isToday ? "disabled" : null,
        onclick:function(){
          if(!sameDay(state.currentDate, todayDate())){
            state.currentDate = addDays(state.currentDate,1);
            render();
          }
        }
      },["›"])
    ]);

    wrap.appendChild(nav);
    wrap.appendChild(buildQuickSelect());

    var dayLog = state.logs[dateStr] || {};
    CATEGORIES.forEach(function(cat){
      wrap.appendChild(buildCatCard(cat, dateStr, dayLog));
    });

    return wrap;
  }

  function buildQuickSelect(){
    var strip = el("div",{class:"quick-select"});
    var today = todayDate();
    for(var i=9;i>=0;i--){
      (function(i){
        var d = addDays(today, -i);
        var dateStr = fmtDate(d);
        var log = state.logs[dateStr];
        var classes = ["qs-day"];
        if(isPeriodLog(log)) classes.push("period");
        if(sameDay(d, state.currentDate)) classes.push("selected");
        if(sameDay(d, today)) classes.push("today");
        var wd = d.toLocaleDateString("de-DE",{weekday:"short"}).replace(".","");
        var btn = el("div",{
          class: classes.join(" "),
          onclick: function(){ state.currentDate = d; render(); }
        },[
          el("span",{class:"wd"},[wd]),
          el("span",{class:"dn"},[String(d.getDate())]),
          log ? el("span",{class:"dot"}) : null
        ]);
        strip.appendChild(btn);
      })(i);
    }
    return strip;
  }

  function buildCatCard(cat, dateStr, dayLog){
    var card = el("div",{class:"cat-card"});
    card.appendChild(el("h3",{},[cat.label]));
    var grid = el("div",{class:"opt-grid"});
    cat.options.forEach(function(opt){
      var selected = dayLog[cat.id] === opt.v;
      var btn = el("button",{
        class:"opt-btn" + (selected ? " selected":""),
        onclick:function(){ setValue(dateStr, cat.id, opt.v); }
      },[opt.l]);
      grid.appendChild(btn);
    });
    card.appendChild(grid);
    return card;
  }

  // ----- Verlauf -----
  function buildVerlauf(){
    var wrap = el("div",{});
    wrap.appendChild(buildBackupCard());

    var dates = Object.keys(state.logs).sort().reverse();
    if(dates.length === 0){
      wrap.appendChild(el("div",{class:"empty-state"},[
        "Noch keine Einträge vorhanden.",
        el("br"),
        "Erfasse deinen ersten Tag im Tab „Heute“."
      ]));
      return wrap;
    }
    dates.forEach(function(dateStr){
      var log = state.logs[dateStr];
      var d = parseDate(dateStr);
      var period = isPeriodLog(log);
      var entry = el("div",{class:"day-entry" + (period ? " period":"")});
      var dateLabel = d.toLocaleDateString("de-DE",{weekday:"short", day:"numeric", month:"long", year:"numeric"});
      var dateRow = el("div",{class:"de-date"},[dateLabel]);
      if(period) dateRow.appendChild(el("span",{class:"badge"},["Periode"]));
      entry.appendChild(dateRow);

      var tags = el("div",{class:"de-tags"});
      CATEGORIES.forEach(function(cat){
        var val = log[cat.id];
        if(!val) return;
        var optLabel = null;
        cat.options.forEach(function(o){ if(o.v===val) optLabel = o.l; });
        tags.appendChild(el("span",{class:"de-tag"},[
          cat.label + ": ",
          el("b",{},[optLabel || val])
        ]));
      });
      entry.appendChild(tags);
      wrap.appendChild(entry);
    });
    return wrap;
  }

  // ----- Backup (Export / Import) -----
  function buildBackupCard(){
    var card = el("div",{class:"backup-card"});
    card.appendChild(el("h3",{},["Daten-Backup"]));
    card.appendChild(el("div",{class:"backup-hint"},[
      "Sichere deine Einträge als Datei, z. B. bevor du ein neues iPhone einrichtest. Beim Import auf dem neuen Gerät werden die Tage aus der Datei übernommen."
    ]));
    var statusBox = el("div",{class:"backup-status", style:"display:none"});
    var actions = el("div",{class:"backup-actions"},[
      el("button",{class:"backup-btn primary", onclick:function(){ exportBackup(statusBox); }},["Backup exportieren"]),
      el("button",{class:"backup-btn", onclick:function(){ importBackup(statusBox); }},["Backup importieren"])
    ]);
    card.appendChild(actions);
    card.appendChild(statusBox);
    return card;
  }

  function showBackupStatus(box, text){
    box.textContent = text;
    box.style.display = "block";
  }

  function exportBackup(statusBox){
    var count = Object.keys(state.logs).length;
    if(count === 0){
      showBackupStatus(statusBox, "Noch keine Einträge zum Exportieren vorhanden.");
      return;
    }
    var dataStr = JSON.stringify(state.logs, null, 2);
    var filename = "koerper-tracker-backup-" + fmtDate(todayDate()) + ".json";
    var blob = new Blob([dataStr], {type:"application/json"});

    if(navigator.share && navigator.canShare){
      try{
        var file = new File([blob], filename, {type:"application/json"});
        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:"Körper-Tracker Backup"}).then(function(){
            showBackupStatus(statusBox, count + " Tage exportiert.");
          }).catch(function(){ /* Nutzer hat abgebrochen */ });
          return;
        }
      }catch(e){ /* fällt durch auf Download */ }
    }

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showBackupStatus(statusBox, count + " Tage exportiert (" + filename + ").");
  }

  function importBackup(statusBox){
    var input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json,.json";
    input.onchange = function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        var imported;
        try{
          imported = JSON.parse(ev.target.result);
        }catch(err){
          showBackupStatus(statusBox, "Diese Datei ist kein gültiges Backup (JSON konnte nicht gelesen werden).");
          return;
        }
        if(typeof imported !== "object" || imported === null || Array.isArray(imported)){
          showBackupStatus(statusBox, "Diese Datei hat nicht das erwartete Backup-Format.");
          return;
        }
        var dateKeyRe = /^\d{4}-\d{2}-\d{2}$/;
        var validKeys = Object.keys(imported).filter(function(k){
          return dateKeyRe.test(k) && typeof imported[k] === "object" && imported[k] !== null;
        });
        if(validKeys.length === 0){
          showBackupStatus(statusBox, "In dieser Datei wurden keine gültigen Tages-Einträge gefunden.");
          return;
        }
        var ok = window.confirm(
          validKeys.length + " Tag(e) in der Backup-Datei gefunden.\n" +
          "Vorhandene Einträge für dieselben Tage werden dabei überschrieben. Fortfahren?"
        );
        if(!ok) return;
        validKeys.forEach(function(k){ state.logs[k] = imported[k]; });
        saveLogs(state.logs);
        render();
        var freshStatusBox = document.querySelector(".backup-status");
        if(freshStatusBox) showBackupStatus(freshStatusBox, validKeys.length + " Tag(e) erfolgreich importiert.");
      };
      reader.readAsText(file);
    };
    input.click();
  }

  // ----- Einblicke -----
  function buildEinblicke(){
    var wrap = el("div",{});
    wrap.appendChild(el("div",{class:"section-title"},["Letzte 35 Tage"]));
    wrap.appendChild(buildRing());
    wrap.appendChild(el("div",{class:"section-title"},["Erkannte Muster"]));
    wrap.appendChild(buildInsights());
    return wrap;
  }

  function buildRing(){
    var days = 35;
    var today = todayDate();
    var list = [];
    for(var i=days-1;i>=0;i--){ list.push(addDays(today,-i)); }

    var size = 280;
    var cx = size/2, cy = size/2;
    var outerR = size/2 - 14;
    var innerR = outerR - 34;
    var gap = 1.6; // degrees
    var step = 360/days;

    var svgParts = [];
    var periodCount = 0, loggedCount = 0;
    list.forEach(function(d, idx){
      var dateStr = fmtDate(d);
      var log = state.logs[dateStr];
      var startA = idx*step + gap/2;
      var endA = (idx+1)*step - gap/2;
      var fill, opacity, stroke;
      if(isPeriodLog(log)){
        fill = "var(--wine)"; opacity = "1"; stroke="none";
        periodCount++; loggedCount++;
      } else if(log){
        fill = "var(--sage)"; opacity = "0.85"; stroke="none";
        loggedCount++;
      } else {
        fill = "none"; stroke = "rgba(241,231,221,0.18)";
      }
      var path = donutSlicePath(cx,cy,innerR,outerR,startA,endA);
      svgParts.push('<path d="'+path+'" fill="'+fill+'" opacity="'+opacity+'" stroke="'+(stroke||'none')+'" stroke-width="1"></path>');
    });

    var svgHtml = '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="auto" style="max-width:300px">' +
      svgParts.join("") +
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(innerR-6)+'" fill="var(--card)"></circle>' +
      '<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" fill="var(--cream)" font-family="Fraunces, serif" font-size="26" font-weight="600">'+periodCount+'</text>' +
      '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" fill="rgba(241,231,221,0.55)" font-family="Inter, sans-serif" font-size="11">Periodentage</text>' +
      '</svg>';

    var box = el("div",{class:"ring-wrap"});
    box.innerHTML = svgHtml;
    var legend = el("div",{class:"ring-legend"},[
      el("div",{class:"li"},[el("span",{class:"sw", style:"background:var(--wine)"}),"Periode"]),
      el("div",{class:"li"},[el("span",{class:"sw", style:"background:var(--sage)"}),"Erfasst"]),
      el("div",{class:"li"},[el("span",{class:"sw", style:"border:1px solid rgba(241,231,221,0.3); background:transparent"}),"Keine Daten"])
    ]);
    box.appendChild(legend);
    return box;
  }

  function polarToCartesian(cx,cy,r,angleDeg){
    var a = (angleDeg-90) * Math.PI/180;
    return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
  }
  function donutSlicePath(cx,cy,innerR,outerR,startAngle,endAngle){
    var so = polarToCartesian(cx,cy,outerR,endAngle);
    var eo = polarToCartesian(cx,cy,outerR,startAngle);
    var si = polarToCartesian(cx,cy,innerR,endAngle);
    var ei = polarToCartesian(cx,cy,innerR,startAngle);
    var largeArc = (endAngle-startAngle) <= 180 ? 0 : 1;
    return "M "+so.x+" "+so.y+
      " A "+outerR+" "+outerR+" 0 "+largeArc+" 0 "+eo.x+" "+eo.y+
      " L "+ei.x+" "+ei.y+
      " A "+innerR+" "+innerR+" 0 "+largeArc+" 1 "+si.x+" "+si.y+" Z";
  }

  // ---- pattern / lift computation ----
  function computeInsights(){
    var dates = Object.keys(state.logs).sort();
    var totalDays = dates.length;

    var periodStarts = dates.filter(function(dateStr){
      if(!isPeriodLog(state.logs[dateStr])) return false;
      var prev = fmtDate(addDays(parseDate(dateStr), -1));
      return !isPeriodLog(state.logs[prev]);
    });

    if(totalDays < 14 || periodStarts.length < 2){
      return {
        insufficient:true,
        totalDays: totalDays,
        periodStartsCount: periodStarts.length
      };
    }

    var preWindowSet = {};
    periodStarts.forEach(function(startStr){
      var start = parseDate(startStr);
      for(var i=1;i<=7;i++){
        preWindowSet[fmtDate(addDays(start,-i))] = true;
      }
    });
    var preWindowDates = Object.keys(preWindowSet).filter(function(d){ return !!state.logs[d]; });

    var baselineDates = dates.filter(function(d){ return !isPeriodLog(state.logs[d]); });

    var insights = [];
    CATEGORIES.forEach(function(cat){
      cat.options.forEach(function(opt){
        var preTotal=0, preMatch=0, baseTotal=0, baseMatch=0;
        preWindowDates.forEach(function(d){
          var val = state.logs[d][cat.id];
          if(val === undefined || val === null) return;
          preTotal++;
          if(val === opt.v) preMatch++;
        });
        baselineDates.forEach(function(d){
          var val = state.logs[d][cat.id];
          if(val === undefined || val === null) return;
          baseTotal++;
          if(val === opt.v) baseMatch++;
        });
        if(preTotal===0 || baseTotal===0 || baseMatch===0) return;
        var ratePre = preMatch/preTotal;
        var rateBase = baseMatch/baseTotal;
        if(rateBase===0) return;
        var lift = ratePre/rateBase;
        if(lift >= 1.4 && preMatch >= 3){
          insights.push({ cat:cat.label, opt:opt.l, lift:lift, n:preMatch });
        }
      });
    });
    insights.sort(function(a,b){ return b.lift - a.lift; });
    return { insufficient:false, insights: insights };
  }

  function buildInsights(){
    var result = computeInsights();
    var wrap = el("div",{});
    if(result.insufficient){
      wrap.appendChild(el("div",{class:"insight-note"},[
        "Noch nicht genug Daten für eine zuverlässige Muster-Erkennung. Erfasse mindestens 2 Periodenstarts und insgesamt etwa 14 Tage – dann können hier Zusammenhänge auftauchen.",
        el("div",{class:"progress"},[
          "Bisher erfasst: " + result.totalDays + " Tag(e), " + result.periodStartsCount + " erkannte(r) Periodenstart(s)."
        ])
      ]));
      return wrap;
    }
    if(result.insights.length === 0){
      wrap.appendChild(el("div",{class:"insight-note"},[
        "Bisher wurden keine auffälligen Muster mit ausreichender Häufigkeit gefunden. Das kann sich ändern, je mehr Tage du erfasst."
      ]));
      return wrap;
    }
    result.insights.slice(0,8).forEach(function(ins){
      var text = 'In der Woche vor deiner Periode ist „' + ins.opt + '“ bei ' + ins.cat + ' ' +
        ins.lift.toFixed(1) + '× häufiger als sonst.';
      wrap.appendChild(el("div",{class:"insight-card"},[text]));
    });
    return wrap;
  }

  render();
})();
</script>
